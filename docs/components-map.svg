<rect x="263" y="155.5" width="249" height="91" rx="11" fill="#e9edfc" stroke="#3b5bdb" stroke-width="2"/>
<text x="387.5" y="184.5" text-anchor="middle" font-size="14.5" font-weight="400" fill="#16202e">Opens the web app</text>
<text x="387.5" y="205.5" text-anchor="middle" font-size="14.5" font-weight="400" fill="#16202e">Clicks "New search"</text>
<text x="387.5" y="226.5" text-anchor="middle" font-size="14.5" font-weight="400" fill="#16202e">Pastes link in WhatsApp (manual)</text>
<rect x="263" y="291.5" width="249" height="91" rx="11" fill="#e8f5ed" stroke="#2b7a4b" stroke-width="2"/>
<text x="387.5" y="320.5" text-anchor="middle" font-size="14.5" font-weight="400" fill="#16202e">Creates the search in Supabase</text>
<text x="387.5" y="341.5" text-anchor="middle" font-size="14.5" font-weight="400" fill="#16202e">Generates one shareable link</text>
<text x="387.5" y="362.5" text-anchor="middle" font-size="14.5" font-weight="400" fill="#16202e">flatsearch.vercel.app/s/k7x2p</text>
<rect x="1638" y="270.5" width="249" height="133" rx="11" fill="#e8f5ed" stroke="#2b7a4b" stroke-width="2"/>
<text x="1762.5" y="299.5" text-anchor="middle" font-size="14.5" font-weight="400" fill="#16202e">Same link = results page</text>
<text x="1762.5" y="320.5" text-anchor="middle" font-size="14.5" font-weight="400" fill="#16202e">Before: "2 of 3 in,</text>
<text x="1762.5" y="341.5" text-anchor="middle" font-size="14.5" font-weight="400" fill="#16202e">waiting for Kavita"</text>
<text x="1762.5" y="362.5" text-anchor="middle" font-size="14.5" font-weight="400" fill="#16202e">After: top 3 flats +</text>
<text x="1762.5" y="383.5" text-anchor="middle" font-size="14.5" font-weight="400" fill="#16202e">per-person cards</text>
<rect x="538" y="410.0" width="249" height="154" rx="11" fill="#e9edfc" stroke="#3b5bdb" stroke-width="2"/>
<text x="662.5" y="439.0" text-anchor="middle" font-size="14.5" font-weight="400" fill="#16202e">Each opens the link, picks her</text>
<text x="662.5" y="460.0" text-anchor="middle" font-size="14.5" font-weight="400" fill="#16202e">name and fills her form privately:</text>
<text x="662.5" y="481.0" text-anchor="middle" font-size="14.5" font-weight="400" fill="#16202e">rent cap · no-go areas</text>
<text x="662.5" y="502.0" text-anchor="middle" font-size="14.5" font-weight="400" fill="#16202e">places I need to be near (max 2)</text>
<text x="662.5" y="523.0" text-anchor="middle" font-size="14.5" font-weight="400" fill="#16202e">dealbreakers (max 3)</text>
<text x="662.5" y="544.0" text-anchor="middle" font-size="14.5" font-weight="400" fill="#16202e">nice-to-haves</text>
<rect x="813" y="586.5" width="249" height="91" rx="11" fill="#e8f5ed" stroke="#2b7a4b" stroke-width="2"/>
<text x="937.5" y="615.5" text-anchor="middle" font-size="14.5" font-weight="400" fill="#16202e">Stores all 3 forms privately</text>
<text x="937.5" y="636.5" text-anchor="middle" font-size="14.5" font-weight="400" fill="#16202e">Nobody sees others' answers</text>
<text x="937.5" y="657.5" text-anchor="middle" font-size="14.5" font-weight="400" fill="#16202e">Unlocks only when all 3 are in</text>
<rect x="813" y="715.0" width="249" height="112" rx="11" fill="#e8f5ed" stroke="#2b7a4b" stroke-width="2"/>
<text x="937.5" y="744.0" text-anchor="middle" font-size="14.5" font-weight="400" fill="#16202e">Paste-in form: rent, area, floor,</text>
<text x="937.5" y="765.0" text-anchor="middle" font-size="14.5" font-weight="400" fill="#16202e">lift, parking, bathrooms, pets</text>
<text x="937.5" y="786.0" text-anchor="middle" font-size="14.5" font-weight="400" fill="#16202e">Unknown fields stay NULL</text>
<text x="937.5" y="807.0" text-anchor="middle" font-size="14.5" font-weight="400" fill="#16202e">(Apify scraper: stretch goal)</text>
<rect x="813" y="861.0" width="249" height="112" rx="11" fill="#e8f5ed" stroke="#2b7a4b" stroke-width="2"/>
<text x="937.5" y="890.0" text-anchor="middle" font-size="14.5" font-weight="400" fill="#16202e">pune-areas.json — 18 areas</text>
<text x="937.5" y="911.0" text-anchor="middle" font-size="14.5" font-weight="400" fill="#16202e">+ coords, + overrides file</text>
<text x="937.5" y="932.0" text-anchor="middle" font-size="14.5" font-weight="400" fill="#16202e">commuteMinutes(from, to)</text>
<text x="937.5" y="953.0" text-anchor="middle" font-size="14.5" font-weight="700" fill="#16202e">Deterministic · no API key</text>
<rect x="1088" y="993.5" width="249" height="175" rx="11" fill="#fff6da" stroke="#dba000" stroke-width="2"/>
<text x="1212.5" y="1022.5" text-anchor="middle" font-size="14.5" font-weight="400" fill="#16202e">Drops any flat that breaks</text>
<text x="1212.5" y="1043.5" text-anchor="middle" font-size="14.5" font-weight="400" fill="#16202e">ANYONE's dealbreaker — including</text>
<text x="1212.5" y="1064.5" text-anchor="middle" font-size="14.5" font-weight="400" fill="#16202e">"too far from a place I named"</text>
<text x="1212.5" y="1085.5" text-anchor="middle" font-size="14.5" font-weight="400" fill="#16202e">NULL field = kept and flagged,</text>
<text x="1212.5" y="1106.5" text-anchor="middle" font-size="14.5" font-weight="400" fill="#16202e">never a silent pass</text>
<text x="1212.5" y="1127.5" text-anchor="middle" font-size="14.5" font-weight="400" fill="#16202e">Ranks by nice-to-haves, lowest</text>
<text x="1212.5" y="1148.5" text-anchor="middle" font-size="14.5" font-weight="400" fill="#16202e">per-person score first · top 3</text>
<rect x="1363" y="1181.5" width="249" height="133" rx="11" fill="#fdeaee" stroke="#dd3355" stroke-width="2"/>
<text x="1487.5" y="1210.5" text-anchor="middle" font-size="14.5" font-weight="400" fill="#16202e">For each of the 3 flats, writes</text>
<text x="1487.5" y="1231.5" text-anchor="middle" font-size="14.5" font-weight="400" fill="#16202e">who gets what + who gives up what</text>
<text x="1487.5" y="1252.5" text-anchor="middle" font-size="14.5" font-weight="400" fill="#16202e">States constraints, not reasons</text>
<text x="1487.5" y="1273.5" text-anchor="middle" font-size="14.5" font-weight="400" fill="#16202e">("needs a lift", never why)</text>
<text x="1487.5" y="1294.5" text-anchor="middle" font-size="14.5" font-weight="400" fill="#16202e">Template fallback if it fails</text>
<rect x="262" y="1333" width="1626" height="124" rx="12" fill="#fff8f0" stroke="#f08c00" stroke-width="2.5" stroke-dasharray="11,8"/>
<text x="286" y="1400.0" font-size="16" font-weight="700" fill="#c25e00">HUMAN GATE — nothing leaves the tool as a decision</text>
<rect x="1638" y="1349.5" width="249" height="91" rx="11" fill="#fff4e6" stroke="#f08c00" stroke-width="2"/>
<text x="1762.5" y="1378.5" text-anchor="middle" font-size="14.5" font-weight="400" fill="#16202e">Discuss the 3 options together</text>
<text x="1762.5" y="1399.5" text-anchor="middle" font-size="14.5" font-weight="400" fill="#16202e">Choose the trade-off</text>
<text x="1762.5" y="1420.5" text-anchor="middle" font-size="14.5" font-weight="400" fill="#16202e">Book visits · the tool never picks</text>
