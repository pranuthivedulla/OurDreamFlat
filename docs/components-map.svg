<text x="1487.5" y="118" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">AI</text>
<text x="1762.5" y="118" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Output</text>
