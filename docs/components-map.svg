<text x="22" y="505.0" font-size="12.5" fill="#95a4b8">Flatmates (each alone)</text>
<rect x="250" y="566" width="1650" height="132" fill="#fbfcfe"/>
<text x="22" y="629.0" font-size="17" font-weight="700" fill="#ffffff">Supabase</text>
<text x="22" y="650.0" font-size="12.5" fill="#95a4b8">Database</text>
<rect x="250" y="698" width="1650" height="146" fill="#f3f6fb"/>
<text x="22" y="768.0" font-size="17" font-weight="700" fill="#ffffff">Listings source</text>
<text x="22" y="789.0" font-size="12.5" fill="#95a4b8">Paste-in form · Apify later</text>
<rect x="250" y="844" width="1650" height="146" fill="#fbfcfe"/>
<text x="22" y="914.0" font-size="17" font-weight="700" fill="#ffffff">Commute table</text>
<text x="22" y="935.0" font-size="12.5" fill="#95a4b8">data/ in the repo · no API key</text>
<rect x="250" y="990" width="1650" height="182" fill="#f3f6fb"/>
<text x="22" y="1078.0" font-size="17" font-weight="700" fill="#ffffff">Filter engine</text>
<text x="22" y="1099.0" font-size="12.5" fill="#95a4b8">App backend on Vercel · no AI</text>
<rect x="250" y="1172" width="1650" height="152" fill="#fbfcfe"/>
<text x="22" y="1245.0" font-size="17" font-weight="700" fill="#ffffff">Gemini Flash</text>
<text x="22" y="1266.0" font-size="12.5" fill="#95a4b8">AI · language only</text>
<rect x="250" y="1324" width="1650" height="142" fill="#f3f6fb"/>
<text x="22" y="1392.0" font-size="17" font-weight="700" fill="#ffffff">Human Gate</text>
<text x="22" y="1413.0" font-size="12.5" fill="#95a4b8">All three, together</text>
<line x1="525" y1="136" x2="525" y2="1466" stroke="#dfe5ee" stroke-width="1"/>
<line x1="800" y1="136" x2="800" y2="1466" stroke="#dfe5ee" stroke-width="1"/>
<line x1="1075" y1="136" x2="1075" y2="1466" stroke="#dfe5ee" stroke-width="1"/>
<line x1="1350" y1="136" x2="1350" y2="1466" stroke="#dfe5ee" stroke-width="1"/>
